name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish app (Release)
        run: dotnet publish CrossDeviceTracker.Desktop.csproj -c Release -o publish

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "CrossDeviceTracker.Desktop-${{ github.ref_name }}.zip"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "CrossDeviceTracker.Desktop-$tag.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists - uploading asset"
            gh release upload $tag $zipName --clobber
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag $zipName --title "CrossDeviceTracker Desktop $tag" --generate-notes
          }
